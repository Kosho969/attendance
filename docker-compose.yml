## Values come from .env (gitignored); see .env.example.

services:
  web:
    build:
      context: .
      args:
        # Baked into the bundle at build time — `docker compose up -d --build web`
        # is required after changing it.
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
    ports:
      # Loopback only: TLS and the public hostname (python.ccti.gt) are handled
      # by the host's reverse proxy, which forwards to this port. Set
      # WEB_BIND=0.0.0.0 only if the proxy runs on another machine.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8400}:80"
    restart: unless-stopped

  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    # Reads VITE_API_URL from .env at startup, so no rebuild is needed here.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  node_modules:
